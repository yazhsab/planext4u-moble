name: planext4u_design_system
description: Accessible Planext4u design tokens, themes, and shared Flutter widgets.
version: 0.1.0
publish_to: none

resolution: workspace

environment:
  sdk: ^3.11.1
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  planext4u_core: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-wght.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-opsz-wght.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-wght.ttf
    - family: Noto Sans Tamil
      fonts:
        - asset: assets/fonts/noto_sans_tamil/NotoSansTamil-wdth-wght.ttf
