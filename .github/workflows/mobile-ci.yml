name: Mobile CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.4

jobs:
  quality:
    name: Format, analyze, contracts, golden and unit/widget tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run melos run verify

  android-builds:
    name: Android ${{ matrix.app }} all flavors
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        app: [customer, vendor, rider]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compile development, staging and production
        working-directory: apps/${{ matrix.app }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug --flavor development \
            --dart-define=APP_ENV=development \
            --dart-define=API_BASE_URL=http://10.0.2.2:8080
          flutter build apk --debug --flavor staging \
            --dart-define=APP_ENV=staging \
            --dart-define=API_BASE_URL=https://staging-api.planext4u.net
          flutter build apk --debug --flavor production \
            --dart-define=APP_ENV=production \
            --dart-define=API_BASE_URL=https://api.planext4u.net

  ios-builds:
    name: iOS ${{ matrix.app }} all flavors
    needs: quality
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [customer, vendor, rider]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compile development, staging and production simulators
        working-directory: apps/${{ matrix.app }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --debug --simulator --no-codesign --flavor development \
            --dart-define=APP_ENV=development \
            --dart-define=API_BASE_URL=http://127.0.0.1:8080
          flutter build ios --debug --simulator --no-codesign --flavor staging \
            --dart-define=APP_ENV=staging \
            --dart-define=API_BASE_URL=https://staging-api.planext4u.net
          flutter build ios --debug --simulator --no-codesign --flavor production \
            --dart-define=APP_ENV=production \
            --dart-define=API_BASE_URL=https://api.planext4u.net

  android-e2e:
    name: MOB-E2E-001 Android emulator
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run fresh-install customer vertical slice
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: >-
            cd apps/customer &&
            flutter test integration_test/customer_vertical_slice_test.dart
            -d emulator-5554
            --flavor development
            --dart-define=APP_ENV=development
            --dart-define=API_BASE_URL=http://10.0.2.2:8080
