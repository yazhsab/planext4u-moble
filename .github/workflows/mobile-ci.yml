name: Mobile CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.41.4

jobs:
  quality:
    name: Format, analyze, contracts, golden and unit/widget tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-swift-package-manager
      - run: flutter pub get
      - run: dart run melos run verify

  android-builds:
    name: Android ${{ matrix.app }} all flavors
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        app: [customer, vendor, rider]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-swift-package-manager
      - run: flutter pub get
      - name: Compile development, staging and production
        working-directory: apps/${{ matrix.app }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug --flavor development \
            --dart-define=APP_ENV=development \
            --dart-define=API_BASE_URL=http://10.0.2.2:8080
          test -s build/app/outputs/flutter-apk/app-development-debug.apk
          flutter clean
          flutter build apk --debug --flavor staging \
            --dart-define=APP_ENV=staging \
            --dart-define=API_BASE_URL=https://staging-api.planext4u.net
          test -s build/app/outputs/flutter-apk/app-staging-debug.apk
          flutter clean
          flutter build apk --debug --flavor production \
            --dart-define=APP_ENV=production \
            --dart-define=API_BASE_URL=https://api.planext4u.net
          test -s build/app/outputs/flutter-apk/app-production-debug.apk

  ios-builds:
    name: iOS ${{ matrix.app }} all flavors
    needs: quality
    # Paystack iOS 0.0.5 uses Swift 6.2 isolated-conformance syntax. GitHub's
    # macOS 26 image provides Xcode 26.5+; macOS 15's Xcode 16 cannot compile it.
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [customer, vendor, rider]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-swift-package-manager
      - run: flutter pub get
      - name: Compile development, staging and production simulators
        working-directory: apps/${{ matrix.app }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build ios --debug --simulator --no-codesign --flavor development \
            --dart-define=APP_ENV=development \
            --dart-define=API_BASE_URL=http://127.0.0.1:8080
          flutter build ios --debug --simulator --no-codesign --flavor staging \
            --dart-define=APP_ENV=staging \
            --dart-define=API_BASE_URL=https://staging-api.planext4u.net
          flutter build ios --debug --simulator --no-codesign --flavor production \
            --dart-define=APP_ENV=production \
            --dart-define=API_BASE_URL=https://api.planext4u.net

  android-e2e:
    name: MOB-E2E-001/002/003/004/005/006/007/008 Android emulator (2 GB)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-swift-package-manager
      - run: flutter pub get
      - name: Enable KVM acceleration
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run customer Phase 3-5 and role Phase 4 vertical slices on a 2 GB device
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-snapshot -no-window -gpu swiftshader_indirect -noaudio
            -no-boot-anim -camera-back none -memory 2048
          script: |
            set -euo pipefail
            cd apps/customer
            flutter test integration_test/customer_vertical_slice_test.dart -d emulator-5554 --flavor development --dart-define=APP_ENV=development --dart-define=API_BASE_URL=http://10.0.2.2:8080
            cd ../vendor
            flutter test integration_test/vendor_phase4_test.dart -d emulator-5554 --flavor development --dart-define=APP_ENV=development --dart-define=API_BASE_URL=http://10.0.2.2:8080
            cd ../rider
            flutter test integration_test/rider_phase4_test.dart -d emulator-5554 --flavor development --dart-define=APP_ENV=development --dart-define=API_BASE_URL=http://10.0.2.2:8080
